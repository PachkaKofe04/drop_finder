[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["generator", "loader", "detectors", "metrics", "flow_graph"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W - стиль, F - ошибки, I - порядок импортов, B - типичные баги, UP - современный синтаксис
select = ["E", "W", "F", "I", "B", "UP"]
